<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="layout">
        <section class="instructions">
            <h1>Conway's Game of Life</h1>
            <h2>How to play</h2>
            <ul>
                <li>Click cells to toggle them alive or dead.</li>
                <li>Press <kbd>Space</kbd> to start or pause.</li>
                <li>Press <kbd>R</kbd> to reset.</li>
            </ul>
            <h2>The rules</h2>
            <ul>
                <li>A live cell with 2 or 3 neighbors survives.</li>
                <li>A dead cell with exactly 3 neighbors becomes alive.</li>
                <li>Every other cell dies or stays dead.</li>
            </ul>
        </section>

        <iframe class="game" src="games/conways/index.html" width="800" height="600" allow="autoplay; fullscreen"
            title="Conway's Game of Life">
        </iframe>
    </main>
</body>

</html>
